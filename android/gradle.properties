org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true

# Tránh lỗi Kotlin incremental cache mà project của bạn đã gặp
kotlin.incremental=false

# Dùng cơ chế Kotlin cũ trong giai đoạn này để tránh plugin
# audioplayers_android gây lỗi khi build với AGP 9.
android.builtInKotlin=false

# Giữ DSL tương thích với Flutter/AGP hiện tại
android.newDsl=false